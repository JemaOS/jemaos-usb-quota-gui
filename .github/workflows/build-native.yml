name: Build Native Installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: windows
          - os: macos-latest
            target: mac
            artifact: macos
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: npm test
      - run: npm run dist:${{ matrix.target }}
      - if: matrix.target == 'win'
        run: npm run dist:win:portable
      - run: node scripts/check-packaged-launch.js
      - uses: actions/upload-artifact@v4
        with:
          name: quota-jemaos-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
