<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'" />
  <title>Quota JemaOS</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="4.6" rx="1.1"/>
            <rect x="7.4" y="7.6" width="9.2" height="13" rx="2.2"/>
            <line x1="10.4" y1="10.8" x2="13.6" y2="10.8"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1 data-i18n="title">Quota JemaOS</h1>
          <p class="sub" data-i18n="subtitle">Provisionner le quota d’installation signé sur une clé USB</p>
        </div>
      </div>
      <div class="controls">
        <button id="lang" class="ctl" type="button" data-i18n="langToggle">EN</button>
        <button id="theme" class="ctl icon" type="button" aria-label="Theme">☾</button>
      </div>
    </header>

    <div id="banner" class="banner hidden" role="alert"></div>

    <section class="card">
      <div class="card-head"><span class="step">1</span><h2 data-i18n="step1">Choisir la clé USB</h2></div>
      <div id="device-list" class="device-list">
        <div class="empty" data-i18n="scanning">Recherche des périphériques…</div>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><span class="step">2</span><h2 data-i18n="step2">Limite d’installations</h2></div>
      <div class="limit-row">
        <button id="limit-dec" class="round" type="button" aria-label="−">−</button>
        <input id="limit" type="number" min="0" step="1" value="100" inputmode="numeric" />
        <button id="limit-inc" class="round" type="button" aria-label="+">+</button>
      </div>
      <div class="presets">
        <button class="chip" data-limit="1" type="button">1</button>
        <button class="chip" data-limit="10" type="button">10</button>
        <button class="chip" data-limit="50" type="button">50</button>
        <button class="chip" data-limit="100" type="button">100</button>
        <button class="chip" data-limit="500" type="button">500</button>
        <button class="chip" data-limit="1000" type="button">1 000</button>
        <button class="chip" data-limit="10000" type="button">10 000</button>
      </div>
      <p class="hint" data-i18n="hintLimit">Nombre maximum d’installations autorisées pour cette clé.</p>
    </section>

    <section class="card actions">
      <button id="init-btn" class="primary" type="button" disabled data-i18n="initBtn">Initialiser la clé</button>
      <p class="hint center" id="action-hint" data-i18n="hintSelect">Sélectionne une clé pour continuer.</p>
    </section>

    <section id="status-card" class="card hidden">
      <div class="card-head"><span class="step ok" id="status-badge">i</span><h2 id="status-title" data-i18n="statusTitle">État de la clé</h2></div>
      <dl id="status-grid" class="grid"></dl>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
